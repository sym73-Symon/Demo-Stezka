<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelen evropský</title>
<style>
  :root{
    --les-dark:#27461D;--les-dark2:#1a2f13;--les-lime:#9DC042;--les-lime-lt:#b2d45a;
    --paper:#F4F6F0;--ink:#22301A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:#27461D;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:0 0 30px;color:var(--paper);
  }
  /* logo POD obrazkem */
  .logo-below{margin-top:26px;text-align:center}
  .logo-below img{width:min(240px,60%);height:auto;display:inline-block}
  .card{
    width:min(520px,94vw);margin-top:20px;background:var(--paper);color:var(--ink);
    border-radius:20px;overflow:hidden;box-shadow:0 24px 60px -20px #000a,0 0 0 1px #ffffff14;
  }
  .photo{
    position:relative;width:100%;aspect-ratio:10/16;overflow:hidden;background:#16240f;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .photo:active img{transform:scale(1.02)}
  .bar{height:6px;background:#dfe6d5;cursor:pointer;position:relative}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--les-lime)}
  .controlbar{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--paper)}
  .pbtn{
    flex:0 0 auto;width:60px;height:60px;border-radius:50%;
    background:var(--les-lime);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px -4px #9dc04277;transition:transform .15s,background .2s;
  }
  .pbtn:hover{background:var(--les-lime-lt)}
  .pbtn:active{transform:scale(.93)}
  .pbtn svg{width:28px;height:28px;fill:#1a2f13;margin-left:2px}
  .pbtn.playing svg.ico-play{display:none}
  .pbtn .ico-pause{display:none;margin-left:0}
  .pbtn.playing .ico-pause{display:block}
  .ctext{flex:1;min-width:0}
  .ctext .t{font-weight:700;font-size:14px;color:var(--les-dark)}
  .ctext .s{font-size:12px;color:#6a7a5e;margin-top:2px}
  .body{padding:20px 26px 24px;text-align:center}
  h1{font-size:30px;line-height:1.05;letter-spacing:-.5px;color:var(--les-dark);font-weight:800}
  .latin{font-style:italic;color:#5a6b4a;font-size:16px;margin-top:5px}
  .langs{margin-top:12px;font-size:13px;letter-spacing:.5px;color:#7a8a6e;line-height:1.7}
</style>
</head>

<script>
  const au=document.getElementById('au'),pbtn=document.getElementById('pbtn'),photo=document.getElementById('photo');
  const fill=document.getElementById('fill'),bar=document.getElementById('bar');
  function toggle(){au.paused?au.play():au.pause()}
  pbtn.addEventListener('click',toggle);
  photo.addEventListener('click',toggle);
  au.onplay=()=>pbtn.classList.add('playing');
  au.onpause=()=>pbtn.classList.remove('playing');
  au.ontimeupdate=()=>{fill.style.width=(au.currentTime/au.duration*100||0)+'%'};
  au.onended=()=>{pbtn.classList.remove('playing');fill.style.width='0%'};
  bar.addEventListener('click',e=>{const r=bar.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*au.duration});
</script>
